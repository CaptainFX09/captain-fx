<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PipZoNe — Under Maintenance</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #101513;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .maintenance-container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    /* LOGO */

    .logo {
      margin-bottom: 45px;
    }

    .logo h1 {
      margin: 0;
      color: #2FBF83;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo h1 span {
      color: #ffffff;
    }

    /* CARD */

    .maintenance-card {
      background: #151b18;
      border: 1px solid #27332e;
      border-radius: 18px;
      padding: 48px 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    /* ICON */

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #1c2b25;
      border: 1px solid #2FBF83;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    /* HEADING */

    h2 {
      font-size: 30px;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .message {
      color: #9ba8a1;
      font-size: 15px;
      line-height: 1.7;
      max-width: 470px;
      margin: 0 auto;
    }

    /* STATUS */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;
      padding: 10px 18px;
      border-radius: 30px;
      background: #10251d;
      border: 1px solid #245c45;
      color: #2FBF83;
      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #2FBF83;
      border-radius: 50%;
      box-shadow: 0 0 10px #2FBF83;
    }

    /* BACK SOON */

    .back-soon {
      margin-top: 30px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
    }

    /* SUPPORT */

    .support {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid #27332e;
      color: #7f8d86;
      font-size: 13px;
      line-height: 1.6;
    }

    .support strong {
      color: #2FBF83;
    }

    /* FOOTER */

    .footer {
      margin-top: 25px;
      color: #5f6c65;
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .logo {
        margin-bottom: 30px;
      }

      .logo h1 {
        font-size: 34px;
      }

      .maintenance-card {
        padding: 38px 22px;
        border-radius: 15px;
      }

      h2 {
        font-size: 25px;
      }

      .message {
        font-size: 14px;
      }

      .icon {
        width: 68px;
        height: 68px;
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="maintenance-container">

    <!-- LOGO -->

    <div class="logo">
      <h1>
        Pip<span>ZoNe</span>
      </h1>
    </div>

    <!-- MAINTENANCE CARD -->

    <div class="maintenance-card">

      <div class="icon">
        🔧
      </div>

      <h2>
        Website Under Maintenance
      </h2>

      <p class="message">
        We're currently improving our platform to provide you
        with a better experience. Please check back shortly.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Maintenance in Progress
      </div>

      <div class="back-soon">
        We'll be back soon.
      </div>

      <div class="support">
        If you need assistance, please contact
        <strong>PipZoNe Support</strong>.
      </div>

    </div>

    <div class="footer">
      © 2026 PipZoNe. All rights reserved.
    </div>

  </div>

</body>
</html>
